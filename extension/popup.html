<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; width: 250px; padding: 15px; background: #f8fafc; color: #1e293b; margin: 0; }
    h2 { margin-top: 0; font-size: 16px; color: #4f46e5; }
    input { width: 100%; box-sizing: border-box; padding: 8px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 6px; }
    button { width: 100%; padding: 8px; background: #4f46e5; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:hover { background: #4338ca; }
    #status { font-size: 12px; margin-top: 10px; color: #ef4444; }
    #loggedInView { display: none; }
    .credit-box { background: #e0e7ff; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h2>🎧 AudioIA Extensión</h2>
  
  <div id="loginView">
    <p style="font-size: 12px; color: #64748b;">Inicia sesión con tu cuenta de AudioIA para usar la extensión.</p>
    <input type="email" id="email" placeholder="Correo electrónico" />
    <input type="password" id="password" placeholder="Contraseña" />
    <button id="loginBtn">Ingresar</button>
    <div id="status"></div>
  </div>

  <div id="loggedInView">
    <div class="credit-box">
      <strong>Sesión Iniciada</strong><br>
      Puedes seleccionar texto, hacer clic derecho y presionar "Leer texto con IA".
    </div>
    <button id="logoutBtn" style="background: #ef4444;">Cerrar Sesión</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
