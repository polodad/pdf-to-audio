<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF a Audio con IA</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .loader {
            border: 4px solid #f3f3f3;
            border-radius: 50%;
            border-top: 4px solid #3b82f6;
            width: 30px;
            height: 30px;
            -webkit-animation: spin 1s linear infinite; /* Safari */
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center font-sans">
    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full mx-4">
        <h1 class="text-3xl font-extrabold text-center text-gray-800 mb-2">Escucha tus PDFs 🎧</h1>
        <p class="text-center text-gray-500 mb-8">Sube tu documento y lo convertiremos a audio usando IA de alta calidad.</p>
        
        <form id="uploadForm" class="space-y-6">
            <div class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center hover:border-blue-500 transition-colors bg-gray-50">
                <input type="file" id="pdfFile" accept="application/pdf" class="hidden" required>
                <label for="pdfFile" class="cursor-pointer flex flex-col items-center">
                    <svg class="w-14 h-14 text-blue-500 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    <span id="fileName" class="text-base text-gray-700 font-medium">Selecciona o arrastra un PDF</span>
                </label>
            </div>
            
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-xl hover:bg-blue-700 transition-colors flex justify-center items-center shadow-lg shadow-blue-200">
                Generar Audio Mágico ✨
            </button>
        </form>

        <div id="loadingIndicator" class="hidden mt-8 flex flex-col items-center">
            <div class="loader mb-4"></div>
            <p class="text-sm text-gray-600 font-medium text-center">Procesando documento...<br><span class="text-xs text-gray-400 font-normal">Esto puede tardar un poco dependiendo del número de páginas.</span></p>
        </div>

        <div id="resultContainer" class="hidden mt-8 bg-blue-50 p-6 rounded-xl border border-blue-100">
            <h3 class="text-lg font-bold text-gray-800 mb-3 text-center">¡Tu audio está listo! 🎉</h3>
            <audio id="audioPlayer" controls class="w-full mb-4">
                Tu navegador no soporta el elemento de audio.
            </audio>
            <div class="flex justify-center mt-2">
                <a id="downloadLink" href="#" download="pdf_audio.mp3" class="text-blue-700 hover:text-blue-800 hover:underline font-semibold flex items-center bg-white px-4 py-2 rounded-lg shadow-sm border border-blue-200">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Descargar MP3
                </a>
            </div>
        </div>
        
        <div id="errorMessage" class="hidden mt-6 p-4 bg-red-50 text-red-700 rounded-xl border border-red-100 text-sm font-medium text-center shadow-sm">
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('pdfFile');
        const fileName = document.getElementById('fileName');
        const form = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const resultContainer = document.getElementById('resultContainer');
        const audioPlayer = document.getElementById('audioPlayer');
        const downloadLink = document.getElementById('downloadLink');
        const errorMessage = document.getElementById('errorMessage');

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                fileName.textContent = e.target.files[0].name;
                fileName.classList.add('text-blue-600', 'font-bold');
            } else {
                fileName.textContent = 'Selecciona o arrastra un PDF';
                fileName.classList.remove('text-blue-600', 'font-bold');
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const file = fileInput.files[0];
            if (!file) return;

            // Reiniciar la interfaz
            errorMessage.classList.add('hidden');
            resultContainer.classList.add('hidden');
            loadingIndicator.classList.remove('hidden');
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            submitBtn.innerHTML = 'Generando...';

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/convert', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Ocurrió un error al procesar el archivo.');
                }

                // Configurar el reproductor con el archivo generado
                audioPlayer.src = data.audio_url;
                downloadLink.href = data.audio_url;
                
                // Mostrar resultados
                loadingIndicator.classList.add('hidden');
                resultContainer.classList.remove('hidden');
                
            } catch (error) {
                errorMessage.textContent = error.message;
                errorMessage.classList.remove('hidden');
                loadingIndicator.classList.add('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                submitBtn.innerHTML = 'Generar Audio Mágico ✨';
            }
        });
    </script>
</body>
</html>
